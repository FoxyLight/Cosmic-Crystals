name: Godot prototype checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Android APK version policy
        run: python3 -m unittest discover -s tests -p test_android_version.py -v
      - name: Download Godot 4.7.2 stable
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            --output godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          mv Godot_v4.7.2-stable_linux.x86_64 godot
      - name: Validate Godot error-log guard
        run: |
          bash scripts/ci/check_godot_log.sh bash -c 'echo "clean Godot log"'
          if bash scripts/ci/check_godot_log.sh bash -c 'echo "SCRIPT ERROR: Parse Error: deliberate CI-guard test"; exit 0'; then
            echo "::error::CI guard accepted a simulated Godot parser error"
            exit 1
          fi
          if bash scripts/ci/check_godot_log.sh bash -c 'echo "ERROR: Failed to load script"; exit 0'; then
            echo "::error::CI guard accepted a simulated failed scene-script load"
            exit 1
          fi
      - name: Import and parse Godot project headlessly
        run: bash scripts/ci/check_godot_log.sh ./godot --headless --path . --editor --quit
      - name: Instantiate gameplay scene and verify a real four-match Star Beam
        run: bash scripts/ci/check_godot_log.sh ./godot --headless --path . --script res://tests/test_game_scene.gd
      - name: Test deterministic match-3 board engine
        run: bash scripts/ci/check_godot_log.sh ./godot --headless --path . --script res://tests/test_board.gd
      - name: Verify gem contrast and distinct silhouettes
        run: bash scripts/ci/check_godot_log.sh ./godot --headless --path . --script res://tests/test_visuals.gd
      - name: Test Star Beams, Cosmic Bombs, Supernova and Nova Pulse
        run: bash scripts/ci/check_godot_log.sh ./godot --headless --path . --script res://tests/test_powers.gd
      - name: Verify all ordered power combinations and Nova-triggered chains
        run: bash scripts/ci/check_godot_log.sh ./godot --headless --path . --script res://tests/test_power_matrix.gd
      - name: Verify special creation and Nova in the playable scene
        run: bash scripts/ci/check_godot_log.sh ./godot --headless --path . --script res://tests/test_power_scene.gd
      - name: Prevent accidental replay and preserve crystals on deadlock
        run: bash scripts/ci/check_godot_log.sh ./godot --headless --path . --script res://tests/test_replay_and_shuffle.gd
      - name: Verify asteroid damage, powers, segmented physics and seeded replay
        run: bash scripts/ci/check_godot_log.sh ./godot --headless --path . --script res://tests/test_asteroids.gd
      - name: Verify asteroid rendering events, input locking and final-move results
        run: bash scripts/ci/check_godot_log.sh ./godot --headless --path . --script res://tests/test_asteroid_scene.gd
      - name: Verify responsive geometry, actual HUD controls, dialogs and touch input
        run: bash scripts/ci/check_godot_log.sh ./godot --headless --path . --script res://tests/test_game_layout.gd
      - name: Run the prototype scene headlessly for 120 frames
        run: bash scripts/ci/check_godot_log.sh ./godot --headless --path . --quit-after 120

  web-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.7.2 stable
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            --output godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          mv Godot_v4.7.2-stable_linux.x86_64 godot
      - name: Install matching web export templates
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" \
            --output godot-templates.tpz
          unzip -q godot-templates.tpz -d extracted
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp extracted/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
      - name: Export HTML5 site
        run: |
          mkdir -p build/web
          bash scripts/ci/check_godot_log.sh ./godot --headless --path . --editor --quit
          bash scripts/ci/check_godot_log.sh ./godot --headless --path . --export-release Web build/web/index.html
          test -s build/web/index.html
          test -s build/web/index.wasm
          test -s build/web/index.pck
          du -h build/web/*
      - name: Upload web preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: cosmic-crystals-web
          path: build/web/
          if-no-files-found: error
          retention-days: 7

  android-debug-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages on the GitHub Linux runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          test -x "$ANDROID_HOME/platform-tools/adb"
      - name: Download Godot 4.7.2 editor
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            --output godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          mv Godot_v4.7.2-stable_linux.x86_64 godot
      - name: Install matching Android export templates
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" \
            --output godot-templates.tpz
          unzip -q godot-templates.tpz -d extracted
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp extracted/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
      - name: Stamp unique Android build version
        id: version
        run: |
          python3 scripts/ci/version_android.py prepare \
            --run-number "$GITHUB_RUN_NUMBER" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --run-id "$GITHUB_RUN_ID" \
            --git-sha "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --github-output "$GITHUB_OUTPUT"
      # Optional long-lived DEBUG signing key, supplied privately in GitHub
      # Actions secret. PRs never receive this key. If absent, exports remain
      # ephemeral debug signed (signature-incompatible with previous runs).
      - name: Load stable debug keystore (main branch only, if configured)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          COSMIC_DEBUG_KEYSTORE_BASE64: ${{ secrets.COSMIC_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$COSMIC_DEBUG_KEYSTORE_BASE64" ]]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$COSMIC_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            keytool -list -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey > /dev/null
            echo "COSMIC_SIGNING_MODE=persistent-secret" >> "$GITHUB_ENV"
            echo "Stable debug signing certificate loaded from private Actions secret."
          fi
      - name: Sign, export and verify versioned Android debug APK
        env:
          APK_PATH: ${{ steps.version.outputs.apk_path }}
        run: |
          mkdir -p "$HOME/.android" build/android
          if [[ "${COSMIC_SIGNING_MODE:-ephemeral-ci}" != "persistent-secret" ]]; then
            keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey -keyalg RSA \
              -keysize 2048 -validity 10000 -dname "CN=Cosmic Crystals Debug,OU=CI,O=Prototype,C=US"
            COSMIC_SIGNING_MODE="ephemeral-ci"
          fi
          export GODOT_ANDROID_KEYSTORE_DEBUG_PATH="$HOME/.android/debug.keystore"
          export GODOT_ANDROID_KEYSTORE_DEBUG_USER="androiddebugkey"
          export GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD="android"
          bash scripts/ci/check_godot_log.sh ./godot --headless --path . --editor --quit
          bash scripts/ci/check_godot_log.sh ./godot --headless --path . --export-debug Android "$APK_PATH"
          test -s "$APK_PATH"
          python3 scripts/ci/version_android.py verify \
            --metadata build/android/build-info.json \
            --apk "$APK_PATH" \
            --aapt "$ANDROID_HOME/build-tools/35.0.0/aapt" \
            --signing-mode "$COSMIC_SIGNING_MODE"
          cat build/android/build-info.json
          du -h "$APK_PATH"
      - name: Upload versioned Android debug APK and metadata
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: build/android/
          if-no-files-found: error
          retention-days: 7
